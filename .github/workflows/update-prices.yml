name: Update hardware prices

on:
  schedule:
    - cron: "17 5 * * *" # every day 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch prices
        run: node price-feed/fetch-prices.js
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

      - name: Commit prices.json if it changed
        run: |
          if git diff --quiet -- price-feed/prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price-feed/prices.json
          git commit -m "Update hardware prices"
          git push
